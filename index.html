<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SemiCode : Exercise_05</title>
	<link rel="icon" type="images/x-icon" href="images/mini_logo.png">
	<link rel="stylesheet" href="css/all.min.css">
	<link rel="stylesheet" href="css/global.css">
	<link rel="stylesheet" href="css/bootstrap.css">
	<link rel="stylesheet" href="css/index.css">
	<link rel="stylesheet" href="css/index.responsive.css">
</head>
<body>
<section id="Register" class="py-5">
	<div class="container d-flex flex-column align-items-center">
		<div class="img text-center">
			<img src="images/logo.png" alt="logo">
		</div>
		<form action="" class="py-3 px-4 rounded-4">
			<h4 class="text-center mt-2 mb-4">Students System</h4>
			<div class="input-group flex-nowrap mb-3">
			  <label class="input-group-text" for="FirstName"><i class="fa-solid fa-user"></i></label>
			  <input type="text" class="form-control" placeholder="First Name *" id="FirstName">
			</div>

			<div class="input-group flex-nowrap mb-3">
			  <label class="input-group-text" for="LastName"><i class="fa-solid fa-user"></i></label>
			  <input type="text" class="form-control" placeholder="Last Name *" id="LastName">
			</div>

			<div class="input-group flex-nowrap mb-3">
			  <label class="input-group-text" for="Email"><i class="fa-solid fa-envelope"></i></label>
			  <input type="text" class="form-control" placeholder="Email *" id="Email">
			</div>

			<div class="input-group flex-nowrap mb-3">
			  <label class="input-group-text" for="Age"><i class="fa-solid fa-hashtag"></i></label>
			  <input type="text" class="form-control" placeholder="Age *" id="Age">
			</div>

			<div class="input-group flex-nowrap mb-3">
			  <label class="input-group-text" for="Phone"><i class="fa-solid fa-mobile"></i></label>
			  <input type="text" class="form-control" placeholder="Phone *" id="Phone">
			</div>
			<button class="btn w-100 btn-success">Add</button>
		</form>
	</div>
</section>
<script src="js/functions.js"></script>
<script src="js/index.js"></script>
</body>
</html>
