<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SemiCode : Exercise_05</title>
	<link rel="icon" type="images/x-icon" href="images/mini_logo.png">
	<link rel="stylesheet" href="css/all.min.css">
	<link rel="stylesheet" href="css/global.css">
	<link rel="stylesheet" href="css/bootstrap.css">

<body>
	<!-- don't forget the  attribute after js done-->
<section id="Register" class="py-5">
	<div class="container">
		<div class="head text-center mb-5">
			<img src="images/logo.png" alt="logo">
		</div>
		<div class="body">
			<form action="" data-type="add" data-edit-student-id="" class="m-auto pt-3 pb-4 px-4 position-relative">
				<h4 class="text-center mt-2 mb-4">Students System</h4>
				<button class="btn btn-success clear d-none">clear</button>
				<i class="fa-solid fa-rotate-left position-absolute reset-icon d-none"></i>
				<div class="input-group flex-nowrap mb-3">
				  <label class="input-group-text" for="FirstName"><i class="fa-solid fa-user"></i></label>
				  <input  autocomplete="off" data-valid="false" onblur="checkInput(this);" type="text" class="form-control" placeholder="First Name *" id="FirstName" name="firstName">
				</div>
				<p class="d-none alert alert-danger" data-error-name="firstName" role="alert"></p>

				<div class="input-group flex-nowrap mb-3">
				  <label class="input-group-text" for="LastName"><i class="fa-solid fa-user"></i></label>
				  <input  autocomplete="off" data-valid="false" onblur="checkInput(this);" type="text" class="form-control" placeholder="Last Name *" id="LastName" name="lastName">
				</div>
				<p class="d-none alert alert-danger" data-error-name="lastName" role="alert"></p>

				<div class="input-group flex-nowrap mb-3">
				  <label class="input-group-text" for="Email"><i class="fa-solid fa-envelope"></i></label>
				  <input  autocomplete="off" data-valid="false" onblur="checkInput(this);" type="text" class="form-control" placeholder="Email *" id="Email" name="email">
				</div>
				<p class="d-none alert alert-danger" data-error-name="email" role="alert"></p>

				<div class="input-group flex-nowrap mb-3">
				  <label class="input-group-text" for="Age"><i class="fa-solid fa-hashtag"></i></label>
				  <input  autocomplete="off" data-valid="false" onblur="checkInput(this);" type="text" class="form-control" placeholder="Age *" id="Age" name="age">
				</div>
				<p class="d-none alert alert-danger" data-error-name="age" role="alert"></p>

				<div class="input-group flex-nowrap mb-3">
				  <label class="input-group-text" for="Phone"><i class="fa-solid fa-mobile"></i></label>
				  <input  autocomplete="off" data-valid="false" onblur="checkInput(this);" type="text" class="form-control" placeholder="Phone *" id="Phone" name="phone">
				</div>
				<p class="d-none alert alert-danger" data-error-name="phone" role="alert"></p>
				<button class="btn w-100 btn-success add">Add</button>
			</form>
		</div>
	</div>
</section>
<!-- problem although it exist data-valid="false" when empty or invalid but it entered the data?????? -->
<section id="Search" class="mb-5">
		<div class="search-input input-group flex-nowrap m-auto mb-3">
			<label class="input-group-text" for="Search"><i class="fa-solid fa-magnifying-glass"></i></label>
			<!-- why when click on label not the same when click on the input??? although the id and for are equal -->
			<input type="text" class="form-control" placeholder="Search..." id="Search" name="search">
		</div>
</section>
<section id="Data" class="w-75 m-auto mb-5">
	<div class="table-responsive">
		<table class="table table-striped table-hover">
  <thead class="table-dark">
    <tr>
      <th>#</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Email</th>
      <th>Age</th>
      <th>Phone</th>
      <th>Option</th>
    </tr>
  </thead>
  <tbody>
  	<tr>
  		<td colspan="7" class="table-alert d-none table-warning text-center rounded-2 py-3">There are no data</td>
  	</tr>
  </tbody>
</table>
	</div>
</section>
